name: tc-workflow

# Event-driven Test Companion CLI pipeline (see testcompanion-pipeline.yml).
#   - PR merged to main  -> `tc workflow run test`  (runs the suite on BrowserStack)
#   - Manual dispatch    -> same workflow, on demand
#   - Failure above      -> `tc workflow run rca`   (root-cause analysis)
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  run-tc:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      # Pin the CLI (set these as repository variables; see README below).
      TC_PIN_VERSION: ${{ vars.TC_PIN_VERSION }}
      TC_SHA256: ${{ vars.TC_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install project dependencies
        working-directory: node-js-playwright-browserstack
        run: npm install

      # GitHub-hosted runners set no Git identity; tc needs one.
      - name: Configure Git identity
        run: |
          git config --global user.email "tc-ci@users.noreply.github.com"
          git config --global user.name "tc-ci"

      - name: Install tc
        run: |
          curl -fsSL -o /tmp/tc-install.sh https://test-companion.browserstack.com/cli/install.sh
          TC_VERSION="$TC_PIN_VERSION" sh /tmp/tc-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sign in
        timeout-minutes: 2
        run: tc auth login

      - name: Run tc workflow (test)
        id: tc_test
        env:
          TC_SHA: ${{ github.sha }}
          TC_BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          tc workflow run test --event pr_merged \
            --context "sha=$TC_SHA,branch=$TC_BASE_BRANCH,instructions=Run the Playwright suite in node-js-playwright-browserstack (ecommerce_store.test.js and staples_link_validation.test.js)" \
            --json --yolo --max-time 25m \
            --summary-file tc-summary.md

      - name: Run tc workflow (rca on failure)
        if: failure() && steps.tc_test.outcome == 'failure'
        env:
          TC_BUILD: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tc workflow run rca --event build_failed \
            --context "build=$TC_BUILD" \
            --json --yolo --max-time 10m \
            --summary-file tc-rca-summary.md

      - name: Publish summary
        if: always()
        run: |
          cat tc-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cat tc-rca-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tc-summary
          path: |
            tc-summary.md
            tc-rca-summary.md
          if-no-files-found: ignore
